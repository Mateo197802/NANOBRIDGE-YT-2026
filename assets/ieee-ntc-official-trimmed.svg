<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 62" width="320" height="62" fill="none">
  <!-- Left Hexagon Badge with NTC -->
  <g transform="translate(6, 4)">
    <!-- Outer Cyan/Deep Blue Hexagon -->
    <polygon points="26,2 52,17 52,47 26,62 0,47 0,17" fill="#04608E" stroke="#0587BD" stroke-width="2.5"/>
    <!-- Inner White Hexagon border -->
    <polygon points="26,6 47,18 47,45 26,57 5,45 5,18" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="3,2"/>
    <!-- NTC text -->
    <text x="26" y="37" font-family="'Inter', 'Arial', system-ui, sans-serif" font-weight="900" font-size="15" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">NTC</text>
  </g>

  <!-- IEEE NANO Main Title & NANOTECHNOLOGY COUNCIL Subtitle -->
  <g transform="translate(68, 6)">
    <text x="0" y="27" font-family="'Anton', 'Arial Black', system-ui, sans-serif" font-weight="900" font-size="29" fill="#1F3E65" letter-spacing="1.2">IEEE NANO</text>
    <text x="0" y="44" font-family="'Inter', 'Arial', system-ui, sans-serif" font-weight="800" font-size="10.5" fill="#04608E" letter-spacing="1.8">NANOTECHNOLOGY COUNCIL</text>
  </g>
</svg>
